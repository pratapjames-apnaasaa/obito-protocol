<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obito Protocol</title>
<meta name="description" content="Daily physique and recovery protocol tracker">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6366f1">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef1f7; --border:#e2e6ef;
    --text:#141821; --text-dim:#5b6373; --text-faint:#8791a1;
    --ring-track:#e7ebf3;
    --accent:#6366f1; --accent-soft:#e8e8fd;
    --c-protein:#16a34a; --c-protein-soft:#dcf5e6;
    --c-training:#ea580c; --c-training-soft:#ffe8da;
    --c-recovery:#8b5cf6; --c-recovery-soft:#efe7fd;
    --c-med:#e11d48; --c-med-soft:#fde0e6;
    --c-sleep:#2563eb; --c-sleep-soft:#dfeafe;
    --good:#16a34a; --good-soft:#dcf5e6;
    --warn:#d97706; --warn-soft:#fdecd0;
    --critical:#dc2626; --critical-soft:#fde1de;
    --shadow: 0 1px 2px rgba(20,20,30,.05), 0 10px 28px -14px rgba(20,20,30,.16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0e14; --surface:#151a23; --surface-2:#1c2330; --border:#2a3241;
      --text:#eef1f6; --text-dim:#9aa4b5; --text-faint:#6b7688;
      --ring-track:#232b39;
      --accent:#818cf8; --accent-soft:#232244;
      --c-protein:#34d399; --c-protein-soft:#123524;
      --c-training:#ff8a5c; --c-training-soft:#3a2015;
      --c-recovery:#a78bfa; --c-recovery-soft:#2a2140;
      --c-med:#fb7185; --c-med-soft:#3a1620;
      --c-sleep:#60a5fa; --c-sleep-soft:#152238;
      --good:#34d399; --good-soft:#123524;
      --warn:#fbbf24; --warn-soft:#3a2c10;
      --critical:#f87171; --critical-soft:#3a1a18;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 34px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,.ring .ring-val,.rl-big{ font-family:"Outfit","Plus Jakarta Sans",sans-serif; }
  .mono,.num,td.num{ font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3{text-wrap:balance;}
  a{color:var(--accent);}
  button{font-family:inherit;}

  .wrap{max-width:1120px; margin:0 auto; padding:24px 20px 100px;}

  /* connect gate */
  .gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;}
  .gate-card{max-width:360px;}
  .gate-mark{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;background:linear-gradient(135deg,#6366f1,#4338ca);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .gate-mark svg{width:32px;height:32px;color:#fff;}
  .gate h1{font-size:1.3rem;font-weight:800;margin:0 0 8px;}
  .gate p{color:var(--text-dim);font-size:.9rem;margin:0 0 22px;}
  .gate-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--accent); color:#fff; border:none;
    border-radius:999px; padding:13px 24px; font-size:.92rem; font-weight:700; cursor:pointer;
    box-shadow:0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .gate-btn svg{width:18px;height:18px;}
  .gate-msg{margin-top:14px;font-size:.8rem;color:var(--critical);min-height:1.2em;}
  .gate-note{margin-top:18px;font-size:.72rem;color:var(--text-faint);}
  [hidden]{display:none !important;}

  header.top{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:18px; }
  .identity .eyebrow{ font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  .identity h1{font-size:1.5rem; font-weight:800; margin:0 0 3px; letter-spacing:-.01em; font-family:"Outfit",sans-serif;}
  .identity .sub{font-size:.82rem; color:var(--text-dim);}
  .hdr-actions{display:flex; align-items:center; gap:10px;}
  .synctag{
    display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:600; color:var(--text-faint);
    border:1px solid var(--border); border-radius:999px; padding:5px 11px; background:var(--surface);
  }
  .synctag .sdot{width:6px;height:6px;border-radius:50%;background:var(--good);}
  .synctag.saving .sdot{background:var(--warn);}
  .synctag.err .sdot{background:var(--critical);}
  .logbtn{
    display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff;
    border:none; border-radius:999px; padding:11px 20px 11px 16px; font-size:.86rem; font-weight:700;
    cursor:pointer; box-shadow:0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .logbtn svg{width:18px;height:18px;}

  .stale-banner{ display:flex; align-items:center; gap:10px; background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:10px 14px; font-size:.82rem; margin-bottom:20px; font-weight:500; }
  .privacy-tag{ margin-left:auto; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); border:1px solid var(--border); border-radius:999px; padding:3px 10px; white-space:nowrap; background:var(--surface); }

  .rings{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px;}
  @media (max-width:720px){.rings{grid-template-columns:1fr;}}
  .ring-card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow); }
  .ring{ --pct:0; width:88px; height:88px; border-radius:50%; flex:none; position:relative; background:conic-gradient(var(--ring-color) calc(var(--pct)*3.6deg), var(--ring-track) 0deg); display:flex; align-items:center; justify-content:center; }
  .ring::before{content:""; position:absolute; inset:8px; border-radius:50%; background:var(--surface);}
  .ring .ring-val{position:relative; z-index:1; font-size:1.1rem; font-weight:700; color:var(--text);}
  .ring-body{flex:1; min-width:0;}
  .ring-body .rl-label{display:flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
  .ring-body .rl-label svg{width:14px;height:14px;}
  .ring-body .rl-big{font-size:1.35rem; font-weight:800; margin-top:4px;}
  .ring-body .rl-note{font-size:.78rem; color:var(--text-dim); margin-top:2px;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:22px;}
  .tile{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:flex-start; }
  .tile .ic{width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;}
  .tile .ic svg{width:18px;height:18px;}
  .tile .tt{font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);}
  .tile .tv{font-size:1rem; font-weight:700; margin-top:2px; font-family:"Outfit",sans-serif;}
  .tile .tn{font-size:.78rem; color:var(--text-dim); margin-top:2px;}

  .grid{display:grid; grid-template-columns:1.15fr 1fr; gap:16px; align-items:start;}
  @media (max-width:880px){.grid{grid-template-columns:1fr;}}
  .col{display:flex; flex-direction:column; gap:16px;}

  section.card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow); }
  section.card h2{ font-size:1rem; font-weight:800; margin:0 0 14px; display:flex; align-items:center; gap:8px; color:var(--text); font-family:"Outfit",sans-serif; }
  section.card h2 .n{color:var(--text-faint); font-weight:500; font-size:.85rem; font-family:"Plus Jakarta Sans",sans-serif;}
  section.card p{margin:0 0 10px; font-size:.9rem; color:var(--text-dim);}
  section.card p:last-child{margin-bottom:0;}
  section.card p strong{color:var(--text); font-weight:700;}

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 10px; border-radius:999px; }
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.critical{background:var(--critical-soft); color:var(--critical);}
  .badge.recovery{background:var(--c-recovery-soft); color:var(--c-recovery);}
  .badge.neutral{background:var(--surface-2); color:var(--text-faint);}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:.85rem; margin:12px 0;}
  .kv dt{color:var(--text-faint); font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding-top:2px;}
  .kv dd{margin:0; color:var(--text);}

  .timeline{list-style:none; margin:14px 0 0; padding:0; border-left:2px solid var(--border);}
  .timeline li{position:relative; padding:0 0 14px 18px;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline li::before{ content:""; position:absolute; left:-6px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--surface); border:2px solid var(--c-recovery); }
  .timeline li.flag::before{border-color:var(--critical); background:var(--critical);}
  .timeline .t-date{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--text-faint); display:block;}
  .timeline .t-text{font-size:.86rem; color:var(--text-dim);}

  .rule-box{ background:var(--c-recovery-soft); border-radius:12px; padding:12px 14px; font-size:.82rem; color:var(--text-dim); margin-top:14px; }
  .rule-box.training{background:var(--c-training-soft);}
  .rule-box.neutral{background:var(--surface-2);}
  .rule-box .lbl{color:var(--text); font-weight:700; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:4px;}

  .sched{list-style:none; margin:0; padding:0;}
  .sched li{display:grid; grid-template-columns:70px 1fr; gap:12px; padding:10px 0; border-top:1px dashed var(--border);}
  .sched li:first-child{border-top:none;}
  .sched .time{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--c-med); font-weight:600; padding-top:2px;}
  .sched .what{font-size:.86rem; color:var(--text);}
  .sched .note{display:block; font-size:.76rem; color:var(--text-faint); margin-top:2px;}

  .chart{display:flex; align-items:flex-end; gap:14px; height:130px; margin:18px 0 6px; padding:0 4px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; position:relative;}
  .bar{width:100%; max-width:46px; border-radius:8px 8px 3px 3px; background:var(--c-protein); position:relative;}
  .bar.hit::after{content:"✓"; position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:.7rem; color:var(--c-protein); font-weight:700;}
  .bar-col .lo{font-size:.62rem; color:var(--text-faint); font-family:"IBM Plex Mono",monospace; position:absolute; bottom:100%; margin-bottom:2px; white-space:nowrap;}
  .bar-col .day{font-size:.68rem; color:var(--text-faint); margin-top:8px; font-family:"IBM Plex Mono",monospace;}
  .target-line{position:relative; border-top:1px dashed var(--c-protein); margin:0 4px 4px; opacity:.5;}
  .target-line span{position:absolute; right:0; top:-9px; font-size:.62rem; color:var(--c-protein); background:var(--surface); padding:0 4px; font-family:"IBM Plex Mono",monospace;}

  table{width:100%; border-collapse:collapse; font-size:.83rem; margin-top:8px;}
  th{text-align:left; font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:700; padding:0 8px 8px 0; border-bottom:1px solid var(--border);}
  td{padding:8px 8px 8px 0; border-bottom:1px solid var(--border); color:var(--text-dim); vertical-align:top;}
  td:first-child{color:var(--text); font-weight:600;}
  tr:last-child td{border-bottom:none;}
  .tablewrap{overflow-x:auto;}

  .chiplist{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chiplist .chip{font-size:.72rem; color:var(--text-dim); background:var(--surface-2); border-radius:999px; padding:4px 11px;}

  .pending-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .pending-list li{display:flex; gap:10px; align-items:flex-start; font-size:.85rem; color:var(--text-dim); background:var(--surface-2); border-radius:10px; padding:9px 12px;}
  .pending-list .flagdot{margin-top:5px; flex:none; width:8px; height:8px; border-radius:50%;}
  .pending-list .flagdot.critical{background:var(--critical);}
  .pending-list .flagdot.warn{background:var(--warn);}

  details.logentry{ border:1px solid var(--border); border-radius:14px; margin-bottom:8px; background:var(--surface); overflow:hidden; }
  details.logentry summary{ list-style:none; cursor:pointer; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  details.logentry summary::-webkit-details-marker{display:none;}
  details.logentry summary .arrow{margin-left:auto; color:var(--text-faint); transition:transform .15s ease; font-size:.8rem;}
  details.logentry[open] summary .arrow{transform:rotate(90deg);}
  details.logentry summary .d-date{font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--accent); font-weight:700; min-width:80px;}
  details.logentry summary .d-protein{font-size:.8rem; color:var(--text-dim); font-family:"IBM Plex Mono",monospace;}
  details.logentry .d-body{padding:0 16px 16px; font-size:.85rem; color:var(--text-dim); border-top:1px solid var(--border); padding-top:12px;}
  details.logentry .d-body p{margin:0 0 8px;}

  footer{ margin-top:32px; padding-top:16px; border-top:1px solid var(--border); font-size:.76rem; color:var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }

  .fab{ position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; border:none; display:none; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 10px 26px -8px color-mix(in srgb, var(--accent) 75%, transparent); z-index:20; }
  .fab svg{width:24px;height:24px;}
  @media (max-width:640px){ .logbtn{display:none;} .fab{display:flex;} }

  dialog#logDialog{ border:none; border-radius:20px; padding:0; width:min(520px,92vw); background:var(--surface); color:var(--text); box-shadow:0 24px 60px -20px rgba(0,0,0,.4); }
  dialog#logDialog::backdrop{background:rgba(10,12,18,.55);}
  .dlg-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
  .dlg-head h3{margin:0; font-size:1.05rem; font-weight:800; font-family:"Outfit",sans-serif;}
  .dlg-close{background:var(--surface-2); border:none; width:30px; height:30px; border-radius:50%; color:var(--text-dim); cursor:pointer; font-size:1rem; line-height:1;}
  .dlg-body{padding:18px 20px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto;}
  .field label{display:block; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; font-size:.9rem; color:var(--text); font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .check-row{display:flex; align-items:center; gap:8px; font-size:.86rem; color:var(--text-dim);}
  .dlg-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 20px; border-top:1px solid var(--border);}
  .dlg-msg{font-size:.8rem; color:var(--critical); flex:1;}
  .dlg-save{background:var(--accent); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-weight:700; font-size:.88rem; cursor:pointer;}
  .dlg-save:disabled{opacity:.6; cursor:default;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1-.5-2-1-2 1.5 1 3 3 3 5a5 5 0 01-10 0c0-4 3-6 3-9 0-1.2.5-2.3 2-3z"/></svg></div>
    <h1>Obito Protocol</h1>
    <p>Your data lives in a private file in your own Google Drive. Connect once to load and save it from this device.</p>
    <button class="gate-btn" id="connectBtn" type="button">
      <svg viewBox="0 0 24 24"><path fill="#fff" d="M12.24 10.4v3.53h5.14c-.22 1.35-1.6 3.96-5.14 3.96-3.1 0-5.63-2.56-5.63-5.72s2.53-5.72 5.63-5.72c1.76 0 2.95.75 3.63 1.4l2.48-2.4C16.9 3.9 14.77 3 12.24 3 7.1 3 3 7.1 3 12.17s4.1 9.17 9.24 9.17c5.33 0 8.86-3.75 8.86-9.03 0-.6-.07-1.07-.15-1.53h-8.7z"/></svg>
      Connect Google Drive
    </button>
    <p class="gate-msg" id="gateMsg"></p>
    <p class="gate-note">Uses the Drive "app data" scope — this app can only see files it creates itself, never the rest of your Drive.</p>
  </div>
</div>

<div class="wrap" id="app" hidden></div>

<button class="fab" id="fabBtn" type="button" aria-label="Log today" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="logDialog">
  <form id="logForm">
    <div class="dlg-head">
      <h3>Log today</h3>
      <button type="button" class="dlg-close" id="dlgCloseBtn" aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <div class="field-row">
        <div class="field"><label for="f-date">Date</label><input type="date" id="f-date" name="date" required></div>
        <div class="field"><label for="f-gym">Training</label>
          <select id="f-gym" name="gym">
            <option value="">Rest day</option>
            <option value="EMS legs/core">Gym — EMS legs/core</option>
            <option value="EMS full">Gym — EMS full body</option>
            <option value="Weights">Gym — free weights</option>
            <option value="Other">Gym — other</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label for="f-protein">Protein today (g)</label><input type="number" id="f-protein" name="protein" min="0" max="400" placeholder="e.g. 158"></div>
        <div class="field"><label for="f-shoulder">Shoulder note</label><input type="text" id="f-shoulder" name="shoulder" placeholder="optional"></div>
      </div>
      <div class="field"><label for="f-notes">Meals, workout detail, anything else</label>
        <textarea id="f-notes" name="notes" placeholder="e.g. Breakfast: omelette + toast (~20g). Leg press 95kg x12. Lunch: dal + rice (~18g)..."></textarea>
      </div>
      <label class="check-row"><input type="checkbox" id="f-arv" name="arv" checked> ARV taken today (keeps the streak)</label>
    </div>
    <div class="dlg-foot">
      <span class="dlg-msg" id="dlgMsg"></span>
      <button type="submit" class="dlg-save" id="dlgSaveBtn">Save entry</button>
    </div>
  </form>
</dialog>

<script>
/* ====================================================================
   Fill this in after creating your OAuth Client ID in Google Cloud
   Console (APIs & Services -> Credentials -> Create Credentials ->
   OAuth client ID -> Web application). Paste the "...apps.googleusercontent.com"
   value below. This ID is public by design (not a secret) for this
   browser-side flow.
==================================================================== */
const GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const STATE_FILENAME = "obito-protocol-state.json";
const LS_FILE_ID = "obito_drive_file_id";
const SS_TOKEN = "obito_access_token";
const SS_TOKEN_EXP = "obito_token_expiry";

const DEFAULT_STATE = {
  profile: {name:"Pratap James", age:52, weight:"67kg", height:"177.8cm", location:"Nizampet, Hyderabad", day1:"Apr 23, 2026"},

// ---------------- Drive persistence ----------------
function getStoredToken(){
  const tok = sessionStorage.getItem(SS_TOKEN);
  const exp = Number(sessionStorage.getItem(SS_TOKEN_EXP) || 0);
  if(tok && Date.now() < exp) return tok;
  return null;
}
function storeToken(tok, expiresInSec){
  sessionStorage.setItem(SS_TOKEN, tok);
  sessionStorage.setItem(SS_TOKEN_EXP, String(Date.now() + (expiresInSec*1000) - 60000));
}

async function driveFetch(url, opts){
  const token = getStoredToken();
  if(!token) throw {code:'no_token'};
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {Authorization: 'Bearer ' + token});
  const res = await fetch(url, opts);
  if(res.status === 401) throw {code:'unauthorized'};
  return res;
}

async function findOrCreateStateFile(){
  const cached = localStorage.getItem(LS_FILE_ID);
  if(cached){
    const check = await driveFetch(`https://www.googleapis.com/drive/v3/files/${cached}?fields=id,trashed`);
    if(check.ok){
      const meta = await check.json();
      if(!meta.trashed) return cached;
    }
  }
  const q = encodeURIComponent(`name='${STATE_FILENAME}' and trashed=false`);
  const listRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const list = await listRes.json();
  if(list.files && list.files.length){
    localStorage.setItem(LS_FILE_ID, list.files[0].id);
    return list.files[0].id;
  }
  const boundary = 'obito-boundary-' + Math.random().toString(36).slice(2);
  const metadata = {name: STATE_FILENAME, mimeType: 'application/json'};
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(DEFAULT_STATE)}\r\n` +
    `--${boundary}--`;
  const createRes = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: {'Content-Type': `multipart/related; boundary=${boundary}`},
    body
  });
  const created = await createRes.json();
  localStorage.setItem(LS_FILE_ID, created.id);
  return created.id;
}

async function loadState(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if(!res.ok) throw {code:'load_failed'};
  return res.json();
}

async function saveState(fileId, state){
  const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(state)
  });
  if(!res.ok) throw {code:'save_failed'};
  return true;
}

function initGis(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    setTimeout(initGis, 200);
    return;

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if(resp.error){ gateMsg.textContent = 'Google sign-in failed: ' + resp.error; return; }
      storeToken(resp.access_token, resp.expires_in);
      afterAuth();
    }
  });
  const existing = getStoredToken();
  if(existing) afterAuth();
}

  const proteinRaw = fd.get('protein');
  const protein = proteinRaw ? parseInt(proteinRaw, 10) : null;
  const shoulder = (fd.get('shoulder')||'').trim();
  const notes = (fd.get('notes')||'').trim();
  const arv = fd.get('arv') === 'on';

  const newDay = STATE.currentDay + 1;
  const entry = {
    day: newDay, date: dateLabel, gym, protein,
    proteinLabel: protein ? protein+'g' : 'no total logged',
    notes: notes || (gym ? 'Gym: '+gym+'.' : 'Rest day.')
  };

  const newState = JSON.parse(JSON.stringify(STATE));
  newState.log.unshift(entry);
  newState.currentDay = newDay;
  newState.arvStreak = arv ? STATE.arvStreak + 1 : 0;
  if(gym) newState.lastSession = {day:newDay, date:dateLabel, type:gym};
  if(shoulder) newState.shoulderNote = shoulder;
  newState.lastUpdatedLabel = dateLabel + ', 2026';

  try{
    await saveState(fileId, newState);
  }catch(err){
    console.error('save failed', err);
    setSync('err');
    dlgSaveBtn.disabled = false;
    if(err && err.code === 'unauthorized'){
      dlgMsg.textContent = 'Session expired — reconnecting…';
      tokenClient.requestAccessToken({prompt: ''});
    } else {
      dlgMsg.textContent = "Couldn't save — check your connection and try again.";
    }
    return;
  }

  // Saved to Drive successfully — UI cleanup below is best-effort and must
  // never re-label a successful save as failed if one of these throws.
  STATE = newState;
  try{ paint(); }catch(e){ console.error('paint after save failed', e); }
  setSync('ok');
  try{ dlg.close(); }catch(e){ console.error('dialog close failed', e); }
  form.reset();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

initGis();
</script>
</body>
</html>
